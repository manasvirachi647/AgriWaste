      { id: 2, username: "gujarat_bio", email: "buyer@biopower.com", phone: "9876543211", password: "password123", name: "Vikram Mehta (Gujarat BioPower)", role: "buyer", location: "Sanand GIDC Biofuel Plant" },
      { id: 3, username: "kisan_trans", email: "trans@kisanfleet.com", phone: "9876543212", password: "password123", name: "Harpreet Singh (Kisan Fleet)", role: "aggregator", location: "Ahmedabad District Fleet Hub" },
      { id: 4, username: "admin", email: "admin@agriwaste.com", phone: "9876543213", password: "adminpassword", name: "System Administrator", role: "admin", location: "Platform Headquarters" }
    ];

    let store = {
      users: [...defaultUsers],
      listings: [
        { id: 1, farmer_id: 1, farmer_name: "Ramesh Patel", material_name: "Rice Husk", available_quantity: 2.0, estimated_quantity: 2.0, unit: "tonnes", price_per_unit: 2400, location_name: "Sanand, Ahmedabad", storage_type: "Dry covered shed", moisture_condition: "Dry (< 12%)", status: "available" },
        { id: 2, farmer_id: 2, farmer_name: "Suresh Chaudhary", material_name: "Rice Husk", available_quantity: 3.0, estimated_quantity: 3.0, unit: "tonnes", price_per_unit: 2350, location_name: "Bavla, Ahmedabad", storage_type: "Baled & stacked", moisture_condition: "Medium (14%)", status: "available" },
        { id: 3, farmer_id: 3, farmer_name: "Mahesh Desai", material_name: "Rice Husk", available_quantity: 5.0, estimated_quantity: 5.0, unit: "tonnes", price_per_unit: 2300, location_name: "Dholka, Ahmedabad", storage_type: "Dry covered shed", moisture_condition: "Dry (< 12%)", status: "available" },
        { id: 4, farmer_id: 1, farmer_name: "Ramesh Patel", material_name: "Wheat Straw", available_quantity: 8.0, estimated_quantity: 8.0, unit: "tonnes", price_per_unit: 1800, location_name: "Sanand, Ahmedabad", storage_type: "Baled & stacked", moisture_condition: "Dry (< 12%)", status: "available" }
      ],

        { id: 2, buyer_id: 2, buyer_name: "Gujarat BioPower Ltd", material_name: "Wheat Straw", required_quantity: 15.0, fulfilled_quantity: 0.0, unit: "tonnes", target_price_max: 1900, delivery_location: "Sanand GIDC Biofuel Plant", quality_specifications: "Baled & stacked", status: "open" }
      ],
      orders: [
        { id: 101, buyer_id: 2, buyer: "Gujarat BioPower Ltd", farmer_id: 1, total_quantity: 2.0, total_amount: 4800, delivery_address: "Sanand GIDC Biofuel Plant", status: "in_transit" }
      ],
      transportJobs: [
        { id: 1, order_id: 101, aggregator_id: 3, dropoff_location: "Sanand GIDC Biofuel Plant", route: "Sanand Farm (2T) ➔ Sanand GIDC", total_qty: 2.0, estimated_distance_km: 24.0, estimated_cost: 1450.0, status: "in_transit" }
      ],
      issues: [
        { id: 1, reporter: "Gujarat BioPower Ltd", title: "Moisture slightly above spec", description: "Batch 2 had 15% moisture.", status: "resolved", resolution_notes: "Farmer agreed to ₹100/T moisture concession." }
      ]

    try {
      const saved = localStorage.getItem("agriwaste_store_v3");
      if (saved) store = { ...store, ...JSON.parse(saved) };
    } catch(e){}

    function persist() {
      try { localStorage.setItem("agriwaste_store_v3", JSON.stringify(store)); } catch(e){}
    }

    async function apiRequest(endpoint, method = 'GET', body = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
      const options = { method, headers };
      if (body && (method === 'POST' || method === 'PATCH' || method === 'PUT')) {
        options.body = JSON.stringify(body);
      }
      const res = await fetch(`${API_BASE}${endpoint}`, options);
      if (!res.ok) {
        let errText = `HTTP ${res.status}`;
        try {
          const errJson = await res.json();
          errText = errJson.detail || errJson.message || JSON.stringify(errJson);
        } catch(e) {
          errText = res.statusText || errText;
        }
        const err = new Error(errText);
        err.status = res.status;
        throw err;
      }
      if (res.status === 204) return null;
      return await res.json();
    }

    function updateBackendStatusUI(live) {
      const b = document.getElementById("prof-sync-badge");
      if (b) {
        if (live) {
          b.className = "px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-bold text-[10px]";
          b.textContent = "🟢 Live Database Connected";
        } else {
          b.className = "px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-bold text-[10px]";
          b.textContent = "🟠 Local Offline Drafts";
        }
      }
    }

    // ====================================================
    // AUTHENTICATION & SESSION PERSISTENCE
    // ====================================================
    async function initApp() {
      try {
        const hRes = await fetch(API_BASE.replace('/api/v1', '/health'), { signal: AbortSignal.timeout(2000) });
        if (hRes.ok) {
          isBackendLive = true;
          updateBackendStatusUI(true);
        }
      } catch(e) {
        isBackendLive = false;
        updateBackendStatusUI(false);
      }

      // Check session token
      if (authToken) {
        try {
          const me = await apiRequest('/auth/me');
          if (me && me.id) {
            currentUser = {
              id: me.id,
              name: me.full_name,
              username: me.username,
              email: me.email,
              phone: me.phone_number || "",
              role: me.role,
              location: me.district ? `${me.district}, Gujarat` : "Gujarat"
            };
            renderAuthenticatedState();
            return;
          }
        } catch(e) {
          authToken = null;
          localStorage.removeItem("agriwaste_jwt_token");
        }
      }

      const savedUser = localStorage.getItem("agriwaste_current_user");
      if (savedUser && !authToken) {
        try {
          currentUser = JSON.parse(savedUser);
          renderAuthenticatedState();
          return;
        } catch(e){}
      }

      hideAllViews();
      document.getElementById("view-auth").classList.remove("hidden");
    }

    async function handleManualLogin(e) {
      e.preventDefault();
      const errorEl = document.getElementById("login-error-msg");
      errorEl.classList.add("hidden");

      const inputUser = document.getElementById("login-username").value.trim();
      const inputPass = document.getElementById("login-password").value;

      try {
        const res = await apiRequest('/auth/login', 'POST', {
          username_or_email: inputUser,
          password: inputPass
        });
        authToken = res.access_token;
        localStorage.setItem("agriwaste_jwt_token", authToken);
        currentUser = {
          id: res.user.id,
          name: res.user.full_name,
          username: res.user.username,
          email: res.user.email,
          phone: res.user.phone_number || "",
          role: res.user.role,
          location: res.user.district ? `${res.user.district}, Gujarat` : "Gujarat"
        };
        localStorage.setItem("agriwaste_current_user", JSON.stringify(currentUser));
        isBackendLive = true;
        updateBackendStatusUI(true);
        document.getElementById("login-password").value = "";
        renderAuthenticatedState();
      } catch(err) {
        if (err.status === 401 || err.status === 403 || err.status === 400) {
          errorEl.innerHTML = `❌ <b>Login Failed:</b> ${err.message}`;
          errorEl.classList.remove("hidden");
          return;
        }
        // Fallback for local demo credentials if server is not reachable
        const matched = store.users.find(u =>
          (u.username && u.username.toLowerCase() === inputUser.toLowerCase()) ||
          (u.email && u.email.toLowerCase() === inputUser.toLowerCase()) ||
          (u.phone && u.phone.trim() === inputUser)
        );
        if (!matched) {
          errorEl.innerHTML = `⚠️ <b>User Not Found:</b> No registered account matching "<i>${inputUser}</i>".`;
          errorEl.classList.remove("hidden");
          return;
        }
        if (matched.password !== inputPass) {
          errorEl.innerHTML = `❌ <b>Incorrect Password:</b> Please enter the correct password.`;
          errorEl.classList.remove("hidden");
          return;
        }
        currentUser = matched;
        localStorage.setItem("agriwaste_current_user", JSON.stringify(currentUser));
        document.getElementById("login-password").value = "";
        renderAuthenticatedState();
      }
    }

    async function handleManualRegister(e) {
      e.preventDefault();
      const role = document.getElementById("reg-role").value;
      const name = document.getElementById("reg-name").value.trim();
      const username = document.getElementById("reg-username").value.trim().toLowerCase();
      const phone = document.getElementById("reg-phone").value.trim();
      const email = document.getElementById("reg-email").value.trim().toLowerCase();
      const password = document.getElementById("reg-password").value;

      if (role === 'admin') {
        alert("Public self-registration as Admin is not permitted.");
        return;
      }

      let payload = {
        username: username,
        email: email,
        password: password,
        full_name: name,
        phone_number: phone || null,
        role: role
      };

      if (role === 'farmer') {
        payload.farm_village = document.getElementById("reg-village").value.trim() || "Sanand";
        payload.district = document.getElementById("reg-district").value.trim() || "Ahmedabad";
      } else if (role === 'buyer') {
        payload.company_name = document.getElementById("reg-company").value.trim() || `${name} Industries`;
        payload.industry_type = document.getElementById("reg-industry").value.trim() || "Biomass Biofuel";
      } else if (role === 'aggregator') {
        payload.vehicle_type = document.getElementById("reg-vehicle").value.trim() || "Commercial Truck";
        payload.district = "Ahmedabad";
      }

      try {
        const res = await apiRequest('/auth/register', 'POST', payload);
        authToken = res.access_token;
        localStorage.setItem("agriwaste_jwt_token", authToken);
        currentUser = {
          id: res.user.id,
          name: res.user.full_name,
          username: res.user.username,
          email: res.user.email,
          phone: res.user.phone_number || "",
          role: res.user.role,
          location: payload.district ? `${payload.district}, Gujarat` : "Gujarat"
        };
        localStorage.setItem("agriwaste_current_user", JSON.stringify(currentUser));
        isBackendLive = true;
        updateBackendStatusUI(true);
        alert(`🎉 Account created! Welcome, ${currentUser.name}. Navigating to your ${currentUser.role.toUpperCase()} Dashboard.`);
        renderAuthenticatedState();
      } catch(err) {
        if (err.status) {
          alert(`Registration Blocked: ${err.message}`);
          return;
        }
        const existing = store.users.find(u => u.username === username || u.email === email);
        if (existing) {
          alert(`An account already exists with username "${username}" or email "${email}".`);
          return;
        }
        const newUser = {
          id: Date.now(),
          name: name,
          username: username,
          phone: phone,
          email: email,
          password: password,
          role: role,
          location: payload.district || "Gujarat"
        };
        store.users.push(newUser);
        persist();
        currentUser = newUser;
        localStorage.setItem("agriwaste_current_user", JSON.stringify(currentUser));
        alert(`🎉 Account created! Welcome, ${newUser.name}.`);
        renderAuthenticatedState();
      }
    }

    function handleLogout() {
      currentUser = null;
      authToken = null;
      localStorage.removeItem("agriwaste_jwt_token");
      localStorage.removeItem("agriwaste_current_user");
      document.getElementById("top-bar").classList.add("hidden");
      document.getElementById("bottom-nav").classList.add("hidden");
      document.getElementById("login-password").value = "";
      hideAllViews();
      document.getElementById("view-auth").classList.remove("hidden");
      switchAuthTab('login');
    }

    function switchAuthTab(tab) {
      const err = document.getElementById("login-error-msg");
      if (err) err.classList.add("hidden");
      if (tab === 'login') {
        document.getElementById("form-login").classList.remove("hidden");
        document.getElementById("form-register").classList.add("hidden");
        document.getElementById("btn-tab-login").classList.add("tab-active", "border-b-2");
        document.getElementById("btn-tab-register").classList.remove("tab-active", "border-b-2");
      } else {
        document.getElementById("form-login").classList.add("hidden");
        document.getElementById("form-register").classList.remove("hidden");
        document.getElementById("btn-tab-register").classList.add("tab-active", "border-b-2");
        document.getElementById("btn-tab-login").classList.remove("tab-active", "border-b-2");
      }
    }

    function toggleRoleProfileInputs() {
      const r = document.getElementById("reg-role").value;
      document.getElementById("role-extra-farmer").classList.toggle("hidden", r !== 'farmer');
      document.getElementById("role-extra-buyer").classList.toggle("hidden", r !== 'buyer');
      document.getElementById("role-extra-transporter").classList.toggle("hidden", r !== 'aggregator');
    }

    function hideAllViews() {
      ['view-auth', 'view-farmer', 'view-buyer', 'view-aggregator', 'view-admin', 'view-market', 'view-orders', 'view-profile'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add("hidden");
      });
    }

    function renderAuthenticatedState() {
      document.getElementById("top-bar").classList.remove("hidden");
      document.getElementById("bottom-nav").classList.remove("hidden");
      document.getElementById("user-display-name").textContent = currentUser.name;
      document.getElementById("user-role-badge").textContent = currentUser.role.toUpperCase();
      document.getElementById("user-location-badge").textContent = "📍 " + (currentUser.location || "Gujarat");

      const actLabel = document.getElementById("nav-activity-label");
      if (actLabel) {
        if (currentUser.role === 'farmer') actLabel.textContent = "My Sales";
        else if (currentUser.role === 'buyer') actLabel.textContent = "Batch Order";
        else if (currentUser.role === 'aggregator') actLabel.textContent = "Trips";
        else actLabel.textContent = "Audits";
      }

      navToTab('dashboard');
    }

    function navToTab(tabName) {
      activeNavTab = tabName;
      hideAllViews();

      ['home', 'market', 'activity', 'profile'].forEach(b => {
        const btn = document.getElementById("nav-btn-" + b);
        if (btn) {
          btn.classList.remove("text-agri-700");
          btn.classList.add("text-slate-400");
        }
      });
      const activeBtn = document.getElementById(
        tabName === 'dashboard' ? 'nav-btn-home' :
        tabName === 'market' ? 'nav-btn-market' :
        tabName === 'activity' ? 'nav-btn-activity' : 'nav-btn-profile'
      );
      if (activeBtn) {
        activeBtn.classList.remove("text-slate-400");
        activeBtn.classList.add("text-agri-700");
      }

      if (tabName === 'dashboard') {
        if (currentUser.role === 'farmer') {
          document.getElementById("view-farmer").classList.remove("hidden");
          renderFarmerDashboard();
        } else if (currentUser.role === 'buyer') {
          document.getElementById("view-buyer").classList.remove("hidden");
          renderBuyerDashboard();
        } else if (currentUser.role === 'aggregator') {
          document.getElementById("view-aggregator").classList.remove("hidden");
          renderAggregatorDashboard();
        } else if (currentUser.role === 'admin') {
          document.getElementById("view-admin").classList.remove("hidden");
          renderAdminDashboard();
        }
      } else if (tabName === 'market') {
        document.getElementById("view-market").classList.remove("hidden");
        renderMarketModule();
      } else if (tabName === 'activity') {
        document.getElementById("view-orders").classList.remove("hidden");
        renderOrdersAndAllocationView();
      } else if (tabName === 'profile') {
        document.getElementById("view-profile").classList.remove("hidden");
        renderProfileView();
      }
    }

    // ====================================================
    // ROLE 1: FARMER DASHBOARD
    // ====================================================
    async function renderFarmerDashboard() {
      if (!currentUser) return;
      document.getElementById("farmer-dash-greeting").textContent = currentUser.name + " 👋";
      document.getElementById("farmer-dash-location").textContent = "📍 Farm Location: " + (currentUser.location || "Sanand, Ahmedabad");

      let myListings = [];
      let myOrders = [];
      let buyerReqs = [];

      try {
        if (isBackendLive && authToken) {
          myListings = await apiRequest('/listings/my');
          myOrders = await apiRequest('/orders');
          buyerReqs = await apiRequest('/requirements');
        } else {
          myListings = store.listings.filter(l => l.farmer_id === currentUser.id);
          myOrders = store.orders.filter(o => o.farmer_id === currentUser.id || o.buyer);
          buyerReqs = store.requirements;
        }
      } catch(e) {
        myListings = store.listings.filter(l => l.farmer_id === currentUser.id);
        myOrders = store.orders.filter(o => o.farmer_id === currentUser.id || o.buyer);
        buyerReqs = store.requirements;
      }

      const activeListings = myListings.filter(l => l.status === 'available');
      const totalT = activeListings.reduce((sum, l) => sum + (l.available_quantity || 0), 0);
      const totalVal = activeListings.reduce((sum, l) => sum + ((l.available_quantity || 0) * l.price_per_unit), 0);

      document.getElementById("farmer-stat-listings").textContent = activeListings.length;
      document.getElementById("farmer-stat-tonnes").textContent = totalT.toFixed(1) + " T";
      document.getElementById("farmer-stat-earnings").textContent = "₹" + (totalVal >= 1000 ? (totalVal/1000).toFixed(1) + "k" : totalVal);

      // Order and collection status
      const colContainer = document.getElementById("farmer-collection-status-container");
      colContainer.innerHTML = "";
      if (myOrders.length === 0) {
        colContainer.innerHTML = `
          <div class="p-3 bg-white rounded-2xl border border-slate-200 text-center text-xs text-slate-500 shadow-xs">
            No active collections in progress. Once a buyer purchases your residue, driver dispatch status will show here.
          </div>
        `;
      } else {
        myOrders.forEach(o => {
          colContainer.innerHTML += `
            <div class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-xs space-y-2 text-xs">
              <div class="flex justify-between items-start">
                <div>
                  <span class="font-black text-slate-900">Order #${o.id}: Total ${o.total_quantity || o.quantity} ${o.unit || 'tonnes'}</span>
                  <div class="text-[11px] text-slate-500 mt-0.5">Value: <b class="text-agri-700">₹${(o.total_amount || 0).toLocaleString()}</b> • Delivery: 📍 ${o.delivery_address || o.route || 'Plant'}</div>
                </div>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-blue-100 text-blue-800">
                  ${o.status}
                </span>
              </div>
            </div>
          `;
        });
      }

      // Recent buyer interests
      const biContainer = document.getElementById("farmer-buyer-interests-container");
      biContainer.innerHTML = "";
      if (buyerReqs.length === 0) {
        biContainer.innerHTML = `<div class="p-3 bg-white rounded-2xl border border-slate-200 text-center text-xs text-slate-500 shadow-xs">No active buyer demands posted currently.</div>`;
      } else {
        buyerReqs.slice(0, 3).forEach(req => {
          biContainer.innerHTML += `
            <div class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-xs flex justify-between items-center text-xs">
              <div>
                <span class="font-black text-slate-900">${req.material_name} Requirement</span>
                <div class="text-[11px] text-slate-600 mt-0.5">Seeking: <b>${req.required_quantity} T</b> (Fulfilled: ${req.fulfilled_quantity || 0} T)</div>
                <div class="text-[10px] text-harvest-700 font-bold">Max Budget: ≤ ₹${req.target_price_max}/T • 📍 ${req.delivery_location}</div>
              </div>
              <button onclick="navToTab('market')" class="px-3 py-1.5 bg-harvest-50 hover:bg-harvest-100 text-harvest-800 border border-harvest-200 rounded-xl font-bold text-[10px] transition active:scale-95">
                View &amp; Offer
              </button>
            </div>
          `;
        });
      }

      // My Active Listings
      const listContainer = document.getElementById("farmer-listings-container");
      listContainer.innerHTML = "";
      if (myListings.length === 0) {
        listContainer.innerHTML = `
          <div class="p-4 bg-white rounded-2xl border border-dashed border-slate-300 text-center text-xs text-slate-500 shadow-xs">
            No crop residue listed yet. Click <b>+ Add Crop Residue Listing</b> above to list surplus crop stubble.
          </div>
        `;
      } else {
        myListings.forEach(l => {
          listContainer.innerHTML += `
            <div class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-xs flex justify-between items-center text-xs">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-black text-slate-900">${l.material_name}</span>
                  <span class="text-[9px] font-black uppercase px-1.5 py-0.2 rounded-full ${l.status === 'available' ? 'bg-agri-100 text-agri-800' : 'bg-slate-100 text-slate-600'}">${l.status}</span>
                </div>
                <div class="text-[11px] text-slate-600 mt-0.5">Available: <b>${l.available_quantity} ${l.unit}</b> • Rate: <b class="text-agri-700">₹${l.price_per_unit}/T</b></div>
                <div class="text-[10px] text-slate-400">Form: ${l.storage_type || 'Dry shed'} • Moisture: ${l.moisture_condition || 'Standard'}</div>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="handleDeleteListing(${l.id})" class="px-2 py-1 bg-red-50 text-red-600 rounded-lg text-[10px] font-bold border border-red-200 hover:bg-red-100">Cancel</button>
              </div>
            </div>
          `;
        });
      }
    }

    async function handleCreateListing(e) {
      e.preventDefault();
      const mat = document.getElementById("add-material").value.trim();
      const qty = parseFloat(document.getElementById("add-qty").value);
      const price = parseFloat(document.getElementById("add-price").value);
      const loc = document.getElementById("add-location").value.trim();
      const storage = document.getElementById("add-storage").value;
      const moist = document.getElementById("add-moisture").value;

      const payload = {
        material_name: mat,
        estimated_quantity: qty,
        unit: "tonnes",
        price_per_unit: price,
        location_name: loc,
        storage_type: storage,
        moisture_condition: moist
      };

      try {
        if (isBackendLive && authToken) {
          await apiRequest('/listings', 'POST', payload);
        } else {

    async function advanceTransportJob(jobId, currentStatus) {
      let nextStatus = 'pickup_in_progress';
      if (currentStatus === 'assigned') nextStatus = 'pickup_in_progress';
      else if (currentStatus === 'pickup_in_progress') nextStatus = 'in_transit';
      else if (currentStatus === 'in_transit') nextStatus = 'delivered';
      else {
        alert("This trip is already marked as delivered.");
        return;
      }

      try {
        if (isBackendLive && authToken) {
          if (currentStatus === 'assigned') {
            try { await apiRequest(`/transport/jobs/${jobId}/claim`, 'POST'); } catch(e){}
          }
          await apiRequest(`/transport/jobs/${jobId}/status`, 'PATCH', {
            status: nextStatus,
            notes: `Status advanced to ${nextStatus}`
          });
          alert(`🎉 Trip status advanced to: ${nextStatus.replace('_', ' ').toUpperCase()}`);
        } else {
          const job = store.transportJobs.find(j => j.id === jobId);
          if (job) job.status = nextStatus;
          persist();
          alert(`Trip status updated: ${nextStatus}`);
        }
        renderAggregatorDashboard();
      } catch(err) {
        alert(`Error advancing trip: ${err.message}`);
      }
    }

      if (activeMarketCategory !== 'all') {
        items = items.filter(l => l.material_name.toLowerCase().includes(activeMarketCategory.toLowerCase()));
      }

      if (query) {
        items = items.filter(l => 
          l.material_name.toLowerCase().includes(query) ||
          (l.farmer_name && l.farmer_name.toLowerCase().includes(query)) ||
          l.location_name.toLowerCase().includes(query)
        );
      }

      if (items.length === 0) {
        container.innerHTML = `
          <div class="p-6 bg-white rounded-2xl border border-slate-200 text-center space-y-2 text-xs text-slate-500 shadow-xs">
            <div class="text-2xl">🔍</div>
            <div class="font-bold text-slate-700">No Residue Listings Found</div>
            <div>Try clearing your search or selecting a different category.</div>
          </div>
        `;
        return;
      }

      items.forEach(l => {
        container.innerHTML += `
          <div class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-xs space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <span class="font-black text-xs text-slate-900">${l.farmer_name || 'Farmer'}</span>
                <span class="text-[10px] text-slate-400 block">📍 ${l.location_name}</span>
              </div>
              <div class="text-right">
                <span class="text-xs font-black text-agri-700">₹${l.price_per_unit}/T</span>
                <span class="text-[9px] bg-agri-50 text-agri-800 font-black px-1.5 py-0.2 rounded block border border-agri-200 mt-0.5">Available</span>
              </div>
            </div>

            <div class="flex items-center gap-2 text-xs bg-slate-50 p-2 rounded-xl">
              <span class="text-base">🌾</span>
              <div class="flex-1">
                <div class="font-extrabold text-slate-800">${l.material_name}</div>
                <div class="text-[10px] text-slate-500">Supply: <b>${l.available_quantity} ${l.unit}</b> • Form: <b>${l.storage_type || 'Dry shed'}</b></div>
              </div>
            </div>

            <div class="flex items-center justify-between text-[10px] text-slate-500 pt-1 border-t border-slate-100">
              <span>Moisture: <b class="text-slate-700">${l.moisture_condition || 'Dry (< 12%)'}</b></span>
              ${currentUser && currentUser.role === 'buyer' ? `
                <button onclick="navToTab('activity')" class="px-3 py-1 bg-agri-700 hover:bg-agri-800 text-white font-bold rounded-lg shadow-xs transition active:scale-95">
                  ⚡ Order / Match
                </button>
              ` : `
                <span class="text-slate-400 italic">Verified Farm Listing</span>
              `}
            </div>
          </div>
        `;
      });
    }

    // ====================================================
    // ACTIVITY / BATCH ORDER & MULTI-FARMER ALLOCATION
    // ====================================================
    async function renderOrdersAndAllocationView() {
      const select = document.getElementById("orders-demand-select");
      const listContainer = document.getElementById("buyer-match-list");
      const allocBox = document.getElementById("buyer-alloc-box");

      let myReqs = [];
      try {
        if (isBackendLive && authToken) {
          myReqs = await apiRequest('/requirements/my');
          myReqs = myReqs.filter(r => r.status === 'open' || r.status === 'partially_fulfilled');
        } else {
          myReqs = store.requirements.filter(r => r.buyer_id === currentUser.id && r.status !== 'fulfilled' && r.status !== 'cancelled');
        }
      } catch(e) {
        myReqs = store.requirements.filter(r => r.buyer_id === currentUser.id && r.status !== 'fulfilled');
      }

      if (myReqs.length === 0) {
        select.innerHTML = `<option value="">No Active Demands (Post a requirement first)</option>`;
        if (allocBox) allocBox.classList.add("hidden");
        listContainer.innerHTML = `
          <div class="p-6 bg-white rounded-2xl border border-dashed border-slate-300 text-center space-y-2 text-xs text-slate-500 shadow-xs">
            <div class="text-2xl">📋</div>
            <div class="font-bold text-slate-800">No Procurement Demand Active</div>
            <p>Post a requirement to combine farmer supplies into one consolidated order.</p>
            <button onclick="openPostRequirementModal()" class="px-4 py-2 bg-harvest-600 text-white font-bold rounded-xl text-xs shadow-xs">+ Post Requirement</button>
          </div>
        `;
        return;
      }

      if (allocBox) allocBox.classList.remove("hidden");
      select.innerHTML = "";
      myReqs.forEach(r => {
        const opt = document.createElement("option");
        opt.value = r.id;
        const rem = (r.required_quantity - (r.fulfilled_quantity || 0)).toFixed(1);
        opt.textContent = `${r.material_name} - ${rem}T remaining (Budget: ≤ ₹${r.target_price_max}/T)`;
        select.appendChild(opt);
      });

      select.onchange = () => renderSmartMatchingList();
      renderSmartMatchingList();
    }

    async function renderSmartMatchingList() {
      const listContainer = document.getElementById("buyer-match-list");
      const select = document.getElementById("orders-demand-select");
      if (!select || !select.value) return;

      const reqId = parseInt(select.value);
      listContainer.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">Loading compatible farmer listings...</div>`;

      let matches = [];
      try {
        if (isBackendLive && authToken) {
          matches = await apiRequest(`/matches/requirements/${reqId}`);
        }
      } catch(e){}

      if (matches.length === 0 && !isBackendLive) {
        const activeReq = store.requirements.find(r => r.id === reqId);
        if (activeReq) {
          matches = store.listings
            .filter(l => l.status === 'available' && l.available_quantity > 0)
            .map(l => {
              const mMatch = (l.material_name || "").toLowerCase().includes(activeReq.material_name.toLowerCase());
              let score = mMatch ? 75 : 10;
              if (l.price_per_unit <= activeReq.target_price_max) score += 15;
              return {
                listing_id: l.id,
                farmer_name: l.farmer_name,
                material_name: l.material_name,
                available_quantity: l.available_quantity,
                unit: l.unit,
                price_per_unit: l.price_per_unit,
                location_name: l.location_name,
                storage_type: l.storage_type,
                moisture_condition: l.moisture_condition,
                score: Math.min(98, score),
                reason: `${score}% Match for ${l.material_name}`
              };
            });
        }
      }

      listContainer.innerHTML = "";
      if (matches.length === 0) {
        listContainer.innerHTML = `
          <div class="p-6 bg-white rounded-2xl border border-dashed border-slate-300 text-center space-y-2 text-xs text-slate-500 shadow-xs">
            <div class="font-bold text-slate-700">No Compatible Residue Listings Found</div>
            <div>No farmers currently have available crop listings matching this requirement.</div>
          </div>
        `;
        recalculateAllocation();
        return;
      }

      matches.forEach(m => {
        listContainer.innerHTML += `
          <div class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-xs flex items-start gap-3 text-xs">
            <input type="checkbox" data-id="${m.listing_id}" data-qty="${m.available_quantity}" data-price="${m.price_per_unit}" onchange="recalculateAllocation()" class="mt-1 w-4 h-4 text-agri-600 rounded" />
            <div class="flex-1 space-y-1">
              <div class="flex justify-between items-start">
                <div>
                  <span class="font-black text-slate-900">${m.farmer_name || 'Farmer'} • ${m.material_name}</span>
                  <div class="text-[11px] text-slate-500">Available: <b>${m.available_quantity} ${m.unit}</b> • Form: ${m.storage_type || 'Dry shed'}</div>
                </div>
                <div class="text-right">
                  <span class="font-black text-agri-700">₹${m.price_per_unit}/T</span>
                  <div class="text-[9px] font-black uppercase px-1.5 py-0.2 rounded-full ${m.score >= 80 ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'}">🎯 ${m.score}% Match</div>
                </div>
              </div>
              <div class="text-[10px] text-slate-400">📍 ${m.location_name} • Moisture: ${m.moisture_condition || 'Standard'}</div>
              ${m.reason ? `<div class="text-[9px] text-slate-500 italic">${m.reason}</div>` : ''}
            </div>
          </div>
        `;
      });

      recalculateAllocation();
    }

    function recalculateAllocation() {
      const checkboxes = document.querySelectorAll("#buyer-match-list input[type='checkbox']:checked");
      let totalQ = 0;
      let totalV = 0;
      checkboxes.forEach(cb => {
        const q = parseFloat(cb.getAttribute("data-qty"));
        const p = parseFloat(cb.getAttribute("data-price"));
        totalQ += q;
        totalV += (q * p);
      });
      document.getElementById("alloc-total-qty").textContent = totalQ.toFixed(1) + " Tonnes";
      document.getElementById("alloc-total-val").textContent = "₹" + totalV.toLocaleString();
    }

    async function handleExecuteMultiFarmerOrder() {
      const select = document.getElementById("orders-demand-select");
      if (!select || !select.value) {
        alert("Please select an active demand first.");
        return;
      }
      const reqId = parseInt(select.value);
      const checked = document.querySelectorAll("#buyer-match-list input[type='checkbox']:checked");
      if (checked.length === 0) {
        alert("Please select at least 1 farmer listing to combine into the order.");
        return;
      }

      const contributions = [];
      let totalQ = 0;
      let totalV = 0;

      checked.forEach(cb => {
        const lid = parseInt(cb.getAttribute("data-id"));
        const q = parseFloat(cb.getAttribute("data-qty"));
        const p = parseFloat(cb.getAttribute("data-price"));
        contributions.push({
          listing_id: lid,
          allocated_quantity: q
        });
        totalQ += q;
        totalV += (q * p);
      });

      if (totalQ <= 0) {
        alert("Selected quantity must be greater than 0.");
        return;
      }

      try {
        if (isBackendLive && authToken) {
          const newOrder = await apiRequest('/orders', 'POST', {
            requirement_id: reqId,
            contributions: contributions,
            delivery_address: "Sanand GIDC Biofuel Plant, Ahmedabad"
          });
          alert(`🎉 Multi-Farmer Order Confirmed!\n\nOrder #${newOrder.id} successfully created!\nBundled: ${newOrder.total_quantity} Tonnes from ${contributions.length} farmers.\nTotal Value: ₹${newOrder.total_amount.toLocaleString()}\nRural transport collection job has been generated automatically.`);
        } else {
          store.orders.unshift({
            id: Date.now(),
            buyer: currentUser.name,
            quantity: totalQ,
            total_amount: totalV,
            status: "requested",
            transporter: "Kisan Fleet Logistics",
            route: `Pickup from ${contributions.length} farms ➔ Dropoff: Sanand GIDC Biofuel Plant`
          });
          persist();
          alert(`🎉 Multi-Farmer Order Confirmed!\n\nBundled ${totalQ.toFixed(1)} Tonnes from ${contributions.length} farms.\nTotal Value: ₹${totalV.toLocaleString()}`);
        }
        navToTab('dashboard');
      } catch(err) {
        alert(`Order Allocation Error: ${err.message}`);
      }
    }

    // ====================================================
    // USER PROFILE & SYSTEM SETTINGS
    // ====================================================
    function renderProfileView() {
      if (!currentUser) return;
      document.getElementById("prof-name").textContent = currentUser.name;
      document.getElementById("prof-role").textContent = currentUser.role.toUpperCase();
      document.getElementById("prof-location-tag").textContent = "📍 " + (currentUser.location || "Gujarat");
      document.getElementById("prof-username").textContent = currentUser.username;
      document.getElementById("prof-email").textContent = currentUser.email;
      document.getElementById("prof-phone").textContent = currentUser.phone || "+91 9876543210";
      document.getElementById("prof-role-desc").textContent = currentUser.role.toUpperCase() + " (Scoped Permissions)";
      updateBackendStatusUI(isBackendLive);
    }

    // ====================================================
    // MODAL DIALOG CONTROLLERS
    // ====================================================
    function openAddResidueModal() { document.getElementById("modal-add-residue").classList.remove("hidden"); }
    function closeAddResidueModal() { document.getElementById("modal-add-residue").classList.add("hidden"); }
    function setAddCrop(crop) { document.getElementById("add-material").value = crop; }

    function openPostRequirementModal() { document.getElementById("modal-post-req").classList.remove("hidden"); }
    function closePostRequirementModal() { document.getElementById("modal-post-req").classList.add("hidden"); }

    function openIssueModal() { document.getElementById("modal-issue").classList.remove("hidden"); }
    function closeIssueModal() { document.getElementById("modal-issue").classList.add("hidden"); }

    async function handleReportIssue(e) {
      e.preventDefault();
      const title = document.getElementById("issue-title").value.trim();
      const desc = document.getElementById("issue-desc").value.trim();

      try {
        if (isBackendLive && authToken) {
          await apiRequest('/issues', 'POST', {
            title: title,
            description: desc,
            category: "quality_mismatch"
          });
        } else {
          store.issues.unshift({
            id: Date.now(),
            reporter: currentUser ? currentUser.name : "User",
            title: title,
            description: desc,
            status: "open"
          });
          persist();
        }
        closeIssueModal();
        alert("⚠️ Issue ticket submitted. Platform moderator will review and resolve.");
      } catch(err) {
        alert(`Failed to submit issue: ${err.message}`);
      }
    }

    // Start App & Check Session on Load
    window.addEventListener("DOMContentLoaded", initApp);
  </script>

</body>
